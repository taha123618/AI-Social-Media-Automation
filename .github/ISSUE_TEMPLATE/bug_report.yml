name: 🐛 Bug Report
description: Report a reproducible bug, defect, or unexpected behavior
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please search existing issues before submitting to avoid duplicates.
        For security issues, please review our [Security Policy](https://github.com/taha123618/AI-Social-Media-Automation/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear, concise description of what the bug is.
      placeholder: When triggering the content publishing worker, an unhandled rejection occurs...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system is affected?
      options:
        - "AI Engine / Autonomous Agents (services/ai/*)"
        - "UI / Frontend Components (app/*, features/*)"
        - "Background Workers & Queues (BullMQ / Redis)"
        - "Database, Prisma & pgvector"
        - "Authentication & Authorization (Better Auth / Admin)"
        - "API Route Handlers (/api/*)"
        - "Billing & Stripe Integration"
        - "DevOps / Docker / CI/CD"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '/studio'
        2. Click on 'Generate Image' with prompt '...'
        3. Observe console error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A concise explanation of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error codes, HTTP status, or stack traces if available.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Information about your local or deployment environment.
      value: |
        - OS: [e.g. macOS 15, Ubuntu 22.04, Windows 11 WSL2]
        - Node.js Version: [e.g. 22.18.0]
        - Bun Version (if applicable): [e.g. 1.3.14]
        - Database: PostgreSQL [e.g. 16 with pgvector]
        - Redis Version: [e.g. 7.0]
        - Browser (if applicable): [e.g. Chrome 128, Safari 18]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any server terminal logs, browser console logs, or Jest output.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and verified this is not a duplicate.
          required: true
        - label: This issue does not contain private credentials, passwords, or live API tokens.
          required: true
