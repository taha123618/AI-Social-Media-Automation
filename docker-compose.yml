version: '3.8'

services:
  # 0. Database Migration Runner (One-shot)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: social_automation_migration
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-social_automation}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: "no"

  # 1. Next.js 16 Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: social_automation_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-social_automation}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-default_better_auth_secret_minimum_32_chars}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-}
      - CRON_SECRET=${CRON_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app_network

  # 2. BullMQ Background Worker & Scheduler
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: social_automation_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-social_automation}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-}
      - CRON_SECRET=${CRON_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh /app/scripts/worker-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app_network

  # 3. PostgreSQL Database with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: social_automation_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-social_automation}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-social_automation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # 4. Redis Cache & BullMQ Message Broker
  redis:
    image: redis:7-alpine
    container_name: social_automation_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge
