global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # 1. Next.js 16 Application Metrics
  - job_name: 'nextjs_app'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000', 'app:3000']
        labels:
          app: 'ai-social-media-automation'
          env: 'production'

  # 2. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 3. Node Exporter (Host System Metrics)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
